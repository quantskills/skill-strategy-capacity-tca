name: Validate

on:
  push:
  pull_request:

jobs:
  qsh-form:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 校验 qsh-form
        run: node scripts/validate-qsh-form.mjs SKILL.md

  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: 离线自检
        run: python scripts/validate.py
